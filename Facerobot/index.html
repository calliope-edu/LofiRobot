          <div class="settings-wrap">
            <button
              id="settings-button"
              class="header-icon-button"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
              data-i18n-title="menu.settings"

            <div id="settings-menu" class="settings-menu" hidden>
              <button id="menu-languages" type="button" class="settings-menu-item" data-i18n="menu.languages">Sprachen</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <section id="demos" class="invisible">
      <div id="liveView" class="videoView">
        <div style="position: relative">
          <video
            id="webcam"
            autoplay
            playsinline
          ></video>
          <canvas
            class="output_canvas"
            id="output_canvas"
            style="position: absolute; left: 0px; top: 0px"
          ></canvas>
        </div>
      </div>
      <div class="blend-shapes">
        <ul class="blend-shapes-list" id="video-blend-shapes"></ul>
      </div>
    </section>

    <!-- Sprachauswahl -->
    <div id="lang-dialog" class="lang-dialog" hidden>
      <div class="lang-box" role="dialog" aria-modal="true">
        <button id="lang-close" class="lang-close" type="button" data-i18n-title="lang.close" title="Schließen">&times;</button>
        <h2 class="lang-title" data-i18n="lang.title">Sprache auswählen</h2>
        <div id="lang-options" class="lang-options"></div>
      </div>
    </div>

    <!-- Welcome Overlay - shown when ?mobile=true -->
    <div id="welcome-overlay">
      <div id="welcome-box">
        <h1 data-i18n-html="welcome.title">Robotersteuerung durch <span>Gesichtserkennung</span></h1>
        <p data-i18n="welcome.subtitle">Der Roboterkopf, der sich so wie du bewegt!</p>
        <button id="welcome-start-btn" onclick="closeWelcomeOverlay()" data-i18n="welcome.start">Verbinden</button>
      </div>
    </div>

    <script>
  // Beim Laden prüfen, ob ?mobile=true in der URL steht
  window.addEventListener("load", function () {
    var urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("mobile") === "true") {
      var overlay = document.getElementById("welcome-overlay");
      if (overlay) {
        overlay.style.display = "flex";
      }
    }
  });

  function closeWelcomeOverlay() {
    document.getElementById("welcome-overlay").style.display = "none";

    // Kamera starten, falls vorhanden
    if (typeof enableCam === "function") {
      enableCam();
    }

    // Calliope verbinden, falls vorhanden
    if (typeof connectButtonPressed === "function") {
      connectButtonPressed();
    }
  }
</script>


  </body>
</html>
